services:
  s3-releases:
    image: 'minio/minio:RELEASE.2025-09-07T16-13-09Z'
    command: 'server /data --console-address ":9001"'
    container_name: s3-releases
    environment:
      MINIO_ROOT_USER: ${S3_RELEASES_USER}
      MINIO_ROOT_PASSWORD: ${S3_RELEASES_PASSWORD}
    volumes: [s3-releases-data:/data]
    networks: [coolify]
    restart: unless-stopped
networks:
  coolify:
    external: true
    name: coolify
volumes:
  s3-releases-data:
