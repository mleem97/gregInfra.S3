# gregInfra.S3 — 6 MinIO S3 instances (Coolify raw-compose deployment).
# Purposes: releases, quarantine, images, scans, backups, docs.
# Credentials come from Coolify app env (S3_<PURPOSE>_USER / S3_<PURPOSE>_PASSWORD).
# Reachable inside the `coolify` network via service names (s3-releases:9000, ...).
# No public Traefik routes: S3 traffic stays internal; presigned browser
# uploads use MINIO_PUBLIC_ENDPOINT overrides per purpose.

services:
  s3-releases:
    image: 'minio/minio:RELEASE.2025-09-07T16-13-09Z'
    command: 'server /data --console-address ":9001"'
    networks: [coolify, proxy]
    restart: unless-stopped
    container_name: s3-releases
    environment:
      MINIO_ROOT_USER: ${S3_RELEASES_USER}
      MINIO_ROOT_PASSWORD: ${S3_RELEASES_PASSWORD}
    volumes: [s3-releases-data:/data]

  s3-quarantine:
    image: 'minio/minio:RELEASE.2025-09-07T16-13-09Z'
    command: 'server /data --console-address ":9001"'
    networks: [coolify, proxy]
    restart: unless-stopped
    container_name: s3-quarantine
    environment:
      MINIO_ROOT_USER: ${S3_QUARANTINE_USER}
      MINIO_ROOT_PASSWORD: ${S3_QUARANTINE_PASSWORD}
    volumes: [s3-quarantine-data:/data]

  s3-images:
    image: 'minio/minio:RELEASE.2025-09-07T16-13-09Z'
    command: 'server /data --console-address ":9001"'
    networks: [coolify, proxy]
    restart: unless-stopped
    container_name: s3-images
    environment:
      MINIO_ROOT_USER: ${S3_IMAGES_USER}
      MINIO_ROOT_PASSWORD: ${S3_IMAGES_PASSWORD}
    volumes: [s3-images-data:/data]

  s3-scans:
    image: 'minio/minio:RELEASE.2025-09-07T16-13-09Z'
    command: 'server /data --console-address ":9001"'
    networks: [coolify, proxy]
    restart: unless-stopped
    container_name: s3-scans
    environment:
      MINIO_ROOT_USER: ${S3_SCANS_USER}
      MINIO_ROOT_PASSWORD: ${S3_SCANS_PASSWORD}
    volumes: [s3-scans-data:/data]

  s3-backups:
    image: 'minio/minio:RELEASE.2025-09-07T16-13-09Z'
    command: 'server /data --console-address ":9001"'
    networks: [coolify, proxy]
    restart: unless-stopped
    container_name: s3-backups
    environment:
      MINIO_ROOT_USER: ${S3_BACKUPS_USER}
      MINIO_ROOT_PASSWORD: ${S3_BACKUPS_PASSWORD}
    volumes: [s3-backups-data:/data]

  s3-docs:
    image: 'minio/minio:RELEASE.2025-09-07T16-13-09Z'
    command: 'server /data --console-address ":9001"'
    networks: [coolify, proxy]
    restart: unless-stopped
    container_name: s3-docs
    environment:
      MINIO_ROOT_USER: ${S3_DOCS_USER}
      MINIO_ROOT_PASSWORD: ${S3_DOCS_PASSWORD}
    volumes: [s3-docs-data:/data]

  s3-init:
    image: 'minio/mc:RELEASE.2025-08-13T08-35-41Z'
    depends_on: [s3-releases, s3-quarantine, s3-images, s3-scans, s3-backups, s3-docs]
    networks: [coolify]
    networks: [coolify]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ready() { a="$1"; h="$2"; u="$3"; p="$4"; i=0; while [ $i -lt 60 ]; do if mc alias set "$a" "http://$h:9000" "$u" "$p" >/dev/null 2>&1; then return 0; fi; i=$((i+1)); sleep 2; done; echo "timeout waiting for $h"; return 1; }
        ready probe-releases s3-releases "$${S3_RELEASES_USER}" "$${S3_RELEASES_PASSWORD}"
        ready probe-quarantine s3-quarantine "$${S3_QUARANTINE_USER}" "$${S3_QUARANTINE_PASSWORD}"
        ready probe-images s3-images "$${S3_IMAGES_USER}" "$${S3_IMAGES_PASSWORD}"
        ready probe-scans s3-scans "$${S3_SCANS_USER}" "$${S3_SCANS_PASSWORD}"
        ready probe-backups s3-backups "$${S3_BACKUPS_USER}" "$${S3_BACKUPS_PASSWORD}"
        ready probe-docs s3-docs "$${S3_DOCS_USER}" "$${S3_DOCS_PASSWORD}"
        mc alias set releases http://s3-releases:9000 "$${S3_RELEASES_USER}" "$${S3_RELEASES_PASSWORD}"
        mc alias set quarantine http://s3-quarantine:9000 "$${S3_QUARANTINE_USER}" "$${S3_QUARANTINE_PASSWORD}"
        mc alias set images http://s3-images:9000 "$${S3_IMAGES_USER}" "$${S3_IMAGES_PASSWORD}"
        mc alias set scans http://s3-scans:9000 "$${S3_SCANS_USER}" "$${S3_SCANS_PASSWORD}"
        mc alias set backups http://s3-backups:9000 "$${S3_BACKUPS_USER}" "$${S3_BACKUPS_PASSWORD}"
        mc alias set docs http://s3-docs:9000 "$${S3_DOCS_USER}" "$${S3_DOCS_PASSWORD}"
        mc mb --ignore-existing releases/mods
        mc mb --ignore-existing quarantine/quarantine
        mc mb --ignore-existing images/avatars
        mc mb --ignore-existing images/banners
        mc mb --ignore-existing images/images
        mc mb --ignore-existing scans/scans
        mc mb --ignore-existing backups/backups
        mc mb --ignore-existing docs/docs
        mc anonymous set download images/images/avatars/
        mc anonymous set download images/images/banners/
        mc anonymous set download images/images/images/
        mc anonymous set download docs/docs/
        echo 'S3 buckets ready.'
        exec tail -f /dev/null
    environment:
      S3_RELEASES_USER: ${S3_RELEASES_USER}
      S3_RELEASES_PASSWORD: ${S3_RELEASES_PASSWORD}
      S3_QUARANTINE_USER: ${S3_QUARANTINE_USER}
      S3_QUARANTINE_PASSWORD: ${S3_QUARANTINE_PASSWORD}
      S3_IMAGES_USER: ${S3_IMAGES_USER}
      S3_IMAGES_PASSWORD: ${S3_IMAGES_PASSWORD}
      S3_SCANS_USER: ${S3_SCANS_USER}
      S3_SCANS_PASSWORD: ${S3_SCANS_PASSWORD}
      S3_BACKUPS_USER: ${S3_BACKUPS_USER}
      S3_BACKUPS_PASSWORD: ${S3_BACKUPS_PASSWORD}
      S3_DOCS_USER: ${S3_DOCS_USER}
      S3_DOCS_PASSWORD: ${S3_DOCS_PASSWORD}

networks:
  coolify:
    external: true
    name: coolify
  proxy:
    external: true
    name: coolify

volumes:
  s3-releases-data:
  s3-quarantine-data:
  s3-images-data:
  s3-scans-data:
  s3-backups-data:
  s3-docs-data:
